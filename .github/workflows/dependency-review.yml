name: Dependency Review

on:
  pull_request:
    branches: [main]
    paths:
      - "package.json"
      - "bun.lock"

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    name: Review Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: always
